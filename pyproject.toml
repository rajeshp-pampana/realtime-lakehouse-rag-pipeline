[project]
name = "realtime-lakehouse-rag-pipeline"
version = "0.1.0"
description = "Hybrid batch + streaming Lakehouse with a retrieval-grounded LLM briefing layer."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
