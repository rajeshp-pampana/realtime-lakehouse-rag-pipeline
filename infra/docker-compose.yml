# Local development stack.
#
# Milestone 1:       airflow  -- single-process `airflow standalone`
#                                (SQLite + SequentialExecutor). Deliberately
#                                not the full multi-container official
#                                reference compose (webserver/scheduler/
#                                triggerer/worker/Postgres/Redis) — this
#                                machine has 8 GB RAM and one linear DAG
#                                doesn't need that topology. Verified via
#                                WSL2 + `airflow dags test` rather than this
#                                compose file for M1 itself.
# Milestone 2:       kafka    -- single-broker KRaft mode (no ZooKeeper).
# Milestone 5 (this): api, ui, tick-producer, stream-consumer — the producer
#                                and consumer move from plain WSL2 processes
#                                into containers, and the service split from
#                                Milestone 4 becomes two real images.
# Milestone 6 adds:  prometheus, grafana
#
# PROFILES. On an 8 GB machine you do not run all of this at once. Services
# without a `profiles` key start by default; the heavier ones are opt-in:
#
#   docker compose up                                        # kafka + api + ui
#   docker compose --profile streaming up                    # + producer/consumer
#   docker compose --profile orchestration up                # + airflow
#   docker compose --profile monitoring up                   # + prometheus/grafana
#   docker compose --profile streaming --profile monitoring up      # the useful pair
#
# The default set (kafka, api, ui) is the product surface plus the broker it
# will need, and fits comfortably. Spark and Airflow are the memory-hungry
# ones, so they stay behind a flag.

name: realtime-lakehouse-rag-pipeline

# Anchor shared by the two streaming services: same image, same environment,
# different command. Keeps them from drifting apart.
x-streaming: &streaming
  build:
    context: ..
    dockerfile: infra/Dockerfile.streaming
  image: rlrp-streaming:local
  environment:
    # kafka:19092 is the in-network listener; host processes use localhost:9092.
    KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
    KAFKA_TICKS_TOPIC: "market.ticks"
    DELTA_TICKS_RAW: "/app/data/delta/ticks_raw"
    # Checkpoints live on a named volume, NOT under the bind-mounted ../data.
    # Spark chmods its checkpoint directory, which fails on a Windows-backed
    # bind mount ("chmod: ... Operation not permitted") and kills the query on
    # startup. A named volume is a real Linux filesystem, and checkpoints are
    # runtime state rather than user data, so this is where they belong anyway.
    STREAM_CHECKPOINT_DIR: "/checkpoints/ticks_stream"
    # The Spark driver serves no HTTP, so nothing can scrape it - it pushes
    # after every micro-batch instead.
    PUSHGATEWAY_URL: "pushgateway:9091"
  volumes:
    - ../data:/app/data
    - stream-checkpoints:/checkpoints
  depends_on:
    kafka:
      condition: service_healthy
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: rlrp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT (19092) is for other containers on this compose network
      # (the containerized stream-consumer); PLAINTEXT_HOST (9092) is for
      # host-side processes.
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Pre-create the topic so the consumer can't lose the race against it.
      # Spark's Kafka source fails hard on UnknownTopicOrPartitionException
      # with no retry - found the hard way in Milestone 2.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "ciWo7IWazngRchmPES6q5A=="
    healthcheck:
      # kafka-broker-api-versions.sh spins up a small JVM client - on this
      # machine that alone can take >10s, which was flipping this healthy
      # broker to "unhealthy" on timeout alone (confirmed via `docker inspect
      # --format '{{json .State.Health}}'`: "Health check exceeded timeout
      # (10s)" while the broker itself was fine and serving real traffic).
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: rlrp-api:local
    container_name: rlrp-api
    ports:
      - "8000:8000"
    environment:
      DELTA_OHLCV_RAW: "/app/data/delta/ohlcv_raw"
      DELTA_OHLCV_CURATED: "/app/data/delta/ohlcv_curated"
      DELTA_TICKS_RAW: "/app/data/delta/ticks_raw"
      VECTORSTORE_DIR: "/app/data/vectorstore"
      BRIEFINGS_DIR: "/app/data/briefings"
      CONTEXT_DOCS_DIR: "/app/docs/context"
      # Ollama runs on the host, not in compose - it is a 4.7GB model server
      # that would dwarf this stack, and it is already installed natively.
      # Reaching it from a container needs the host gateway AND ollama bound
      # beyond loopback (OLLAMA_HOST=0.0.0.0 on the host). Without that, the
      # read endpoints all work and only POST /briefings returns 502.
      OLLAMA_HOST: "http://host.docker.internal:11434"
      # The API is scraped at /metrics rather than pushing, but batch tasks run
      # in other containers with the same image family and do push.
      PUSHGATEWAY_URL: "pushgateway:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/app/data
      # Read-only: the API retrieves from the index, it never rebuilds it.
      - ../docs/context:/app/docs/context:ro
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ui
    image: rlrp-ui:local
    container_name: rlrp-ui
    ports:
      - "8501:8501"
    environment:
      # The payoff for keeping API_BASE_URL separate from API_HOST/API_PORT in
      # Milestone 4: the UI dials a service name here, and the API's own
      # binding is unchanged.
      API_BASE_URL: "http://api:8000"
      API_BRIEFING_TIMEOUT_SECONDS: "900"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # `--duration 0` / `--timeout 0` mean "run until stopped". Both modules
  # defaulted to a bounded run (30s / 60s) because Milestone 2 only needed
  # verification runs - left as-is, `restart: unless-stopped` would turn them
  # into restart loops instead of services.
  tick-producer:
    <<: *streaming
    container_name: rlrp-tick-producer
    command: ["python", "-m", "src.streaming.tick_producer", "--duration", "0"]
    profiles: ["streaming"]

  stream-consumer:
    <<: *streaming
    container_name: rlrp-stream-consumer
    command: ["python", "-m", "src.streaming.stream_consumer", "--timeout", "0"]
    profiles: ["streaming"]

  airflow:
    build:
      context: ..
      dockerfile: infra/Dockerfile.airflow
    image: rlrp-airflow:local
    container_name: rlrp-airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
    ports:
      - "8080:8080"
    volumes:
      - airflow-state:/opt/airflow
      - ../dags:/opt/airflow/dags
      - ../src:/opt/airflow/src
      - ../data:/opt/airflow/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles: ["orchestration"]

  # --- Observability (Milestone 6) -----------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: rlrp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Short retention on purpose: this is a laptop, and the dashboard's
      # longest window is an hour.
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped
    profiles: ["monitoring"]

  pushgateway:
    image: prom/pushgateway:v1.11.0
    container_name: rlrp-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: rlrp-grafana
    ports:
      - "3000:3000"
    environment:
      # Local dev only. Anonymous admin access means the dashboard is useful
      # the moment it starts; this is not a deployment posture.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles: ["monitoring"]

volumes:
  airflow-state:
  prometheus-data:
  grafana-data:
  # Spark Structured Streaming checkpoints. Deliberately a named volume rather
  # than a host bind mount - see STREAM_CHECKPOINT_DIR above.
  stream-checkpoints:
