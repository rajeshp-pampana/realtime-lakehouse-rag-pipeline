# Services fronting the API and UI Deployments.
#
# Two roles, deliberately separated:
#
#  - rlrp-api (ClusterIP) is how the UI reaches the API. It is the in-cluster
#    equivalent of compose's `http://api:8000`, and it is the only address the
#    UI is configured with. Nothing outside the cluster needs it.
#
#  - the *-nodeport Services expose both to the host for local inspection,
#    paired with the extraPortMappings in kind-cluster.yaml so they land on
#    localhost:8000 / localhost:8501 on Windows. NodePort is used rather than
#    an Ingress because this cluster has no ingress controller: adding one
#    would be a second thing to install, keep running and debug, for no gain
#    on a single-node local cluster.
---
apiVersion: v1
kind: Service
metadata:
  name: rlrp-api
  namespace: rlrp
  labels: { app.kubernetes.io/name: rlrp, app.kubernetes.io/component: api }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: rlrp, app.kubernetes.io/component: api }
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: rlrp-api-nodeport
  namespace: rlrp
  labels: { app.kubernetes.io/name: rlrp, app.kubernetes.io/component: api }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: rlrp, app.kubernetes.io/component: api }
  ports:
    - name: http
      port: 8000
      targetPort: http
      # Must match containerPort in kind-cluster.yaml's extraPortMappings.
      nodePort: 30800
---
apiVersion: v1
kind: Service
metadata:
  name: rlrp-ui
  namespace: rlrp
  labels: { app.kubernetes.io/name: rlrp, app.kubernetes.io/component: ui }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: rlrp, app.kubernetes.io/component: ui }
  ports:
    - name: http
      port: 8501
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: rlrp-ui-nodeport
  namespace: rlrp
  labels: { app.kubernetes.io/name: rlrp, app.kubernetes.io/component: ui }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: rlrp, app.kubernetes.io/component: ui }
  ports:
    - name: http
      port: 8501
      targetPort: http
      nodePort: 30851
