# Defaults target a local kind cluster with images built by
# `docker compose build` and loaded via `kind load docker-image`.

# Namespace comes from `helm -n <ns>` (.Release.Namespace), not from here -
# templating it separately lets the chart disagree with the flag you install
# with. Kept only as the documented default for that flag.
# namespace: rlrp

# Images are local; there is no registry. pullPolicy MUST stay IfNotPresent or
# the kubelet tries to pull rlrp-api:local from Docker Hub and lands in
# ImagePullBackOff.
image:
  pullPolicy: IfNotPresent

api:
  replicaCount: 1
  image:
    repository: rlrp-api
    tag: local
  service:
    port: 8000
    nodePort: 30800
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 768Mi }

ui:
  replicaCount: 1
  image:
    repository: rlrp-ui
    tag: local
  service:
    port: 8501
    nodePort: 30851
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits:   { cpu: "1",  memory: 640Mi }

# The uid baked into both images. Pods must run as this to read the mounted
# lakehouse.
securityContext:
  runAsUser: 10001
  runAsGroup: 10001

# Host path exposed by the kind node (see infra/k8s/kind-cluster.yaml).
lakehouse:
  hostPath: /lakehouse

# Local LLM, so the retrieval-grounded briefing works in-cluster and not only
# on a developer's machine. Disabled by default: the model is ~4.7GB to pull
# and needs ~5.0-5.6GB resident, which is more than a laptop kind cluster
# usually has spare. Enable with --set ollama.enabled=true.
ollama:
  enabled: false
  image:
    repository: ollama/ollama
    tag: "0.5.4"
  service:
    port: 11434
  # Models are pulled by an init container on first start.
  models:
    - llama3
    - nomic-embed-text
  # Keep a model resident longer than the 5m default so a second briefing is
  # warm (~66-93s) rather than a cold reload (~480s).
  keepAlive: "30m"
  persistence:
    # A PVC so the ~4.7GB pull survives pod restarts. kind ships a default
    # StorageClass; set storageClass explicitly on a cluster that does not.
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits:   { cpu: "4",  memory: 7Gi }

config:
  deltaOhlcvRaw: /app/data/delta/ohlcv_raw
  deltaOhlcvCurated: /app/data/delta/ohlcv_curated
  deltaTicksRaw: /app/data/delta/ticks_raw
  vectorstoreDir: /app/data/vectorstore
  briefingsDir: /app/data/briefings
  briefingTimeoutSeconds: "900"
  # Left empty: when ollama.enabled is true the chart points the API at the
  # in-cluster Service automatically. Set this only to reach an Ollama that
  # lives outside the cluster. With neither, read endpoints all work and
  # POST /briefings returns 502.
  ollamaHost: ""
