apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rlrp.labels" . | nindent 4 }}
data:
  DELTA_OHLCV_RAW: {{ .Values.config.deltaOhlcvRaw | quote }}
  DELTA_OHLCV_CURATED: {{ .Values.config.deltaOhlcvCurated | quote }}
  DELTA_TICKS_RAW: {{ .Values.config.deltaTicksRaw | quote }}
  VECTORSTORE_DIR: {{ .Values.config.vectorstoreDir | quote }}
  BRIEFINGS_DIR: {{ .Values.config.briefingsDir | quote }}
  API_BRIEFING_TIMEOUT_SECONDS: {{ .Values.config.briefingTimeoutSeconds | quote }}
  {{- if .Values.ollama.enabled }}
  # Ollama runs in-cluster, so the API reaches it by Service name - the same
  # substitution the UI makes for the API. An explicit config.ollamaHost still
  # wins, for pointing at an Ollama outside the cluster.
  OLLAMA_HOST: {{ .Values.config.ollamaHost | default (printf "http://%s-ollama:%v" .Release.Name .Values.ollama.service.port) | quote }}
  {{- else if .Values.config.ollamaHost }}
  OLLAMA_HOST: {{ .Values.config.ollamaHost | quote }}
  {{- end }}
  # In-cluster DNS. The UI only ever knows the API by its Service name, which
  # is what makes the Milestone 4 split pay off unchanged here.
  API_BASE_URL: "http://{{ .Release.Name }}-api:{{ .Values.api.service.port }}"
